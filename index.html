<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ Tool V5 - Optimizer</title>
    <script src="./abcd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <style>
        /* === Premium Apple Liquid Background === */
        :root {
            --apple-blue: #0A84FF;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --text-color: #F5F5F7;
        }
        
        body {
            margin: 0; padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            
            /* Fluid/Liquid Moving Gradient Background (More Contrast & Dynamic Flow) */
            background: linear-gradient(-45deg, #050814, #0f172a, #1e1145, #0a1b3a, #11092c);
            background-size: 400% 400%;
            animation: liquidBG 8s ease-in-out infinite;
            
            /* Anti-Copy */
            user-select: none; -webkit-user-select: none;
        }

        @keyframes liquidBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%; max-width: 600px;
            margin-top: 10px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* === Social Links === */
        .social-bar {
            display: flex; justify-content: space-between; margin-bottom: 25px; gap: 12px;
        }
        .social-btn {
            flex: 1; padding: 12px; text-align: center; border-radius: 14px;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); text-decoration: none;
            color: #fff; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s;
        }
        .social-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

        /* === Title & Credit === */
        .title-container { text-align: center; margin-bottom: 25px; }
        .main-title {
            font-size: 2.8rem; font-weight: 800; margin: 0;
            background: linear-gradient(90deg, #fff, #4dabf7, #a29bfe, #fff);
            background-size: 200% auto;
            color: transparent; -webkit-background-clip: text;
            animation: premiumShine 4s linear infinite;
            letter-spacing: -1px; text-shadow: 0 0 20px rgba(77,171,247,0.3);
        }
        @keyframes premiumShine { to { background-position: 200% center; } }
        .credit { font-size: 0.85rem; color: #a1a1a6; margin-top: 5px; font-weight: 500; letter-spacing: 0.5px; }

        /* === Engine Loader === */
        .loader-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            color: #4dabf7; font-weight: bold; margin-bottom: 20px;
        }
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(77, 171, 247, 0.3); border-top-color: #4dabf7;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-text { color: #34C759; display: none; text-shadow: 0 0 10px rgba(52, 199, 89, 0.4);}

        /* === Premium Glass Box === */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2); 
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px; padding: 22px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        /* === File Upload === */
        .file-upload-btn {
            display: block; width: 100%; padding: 18px; text-align: center;
            background: rgba(10, 132, 255, 0.08); border: 1.5px dashed var(--apple-blue);
            border-radius: 14px; cursor: pointer; color: #fff; font-weight: 600;
            transition: 0.3s; box-sizing: border-box;
        }
        .file-upload-btn:hover { background: rgba(10, 132, 255, 0.15); }
        input[type="file"] { display: none; }
        .video-details {
            display: none; margin-top: 15px; font-size: 0.8rem; color: #a1a1a6;
            grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(0,0,0,0.25);
            padding: 15px; border-radius: 12px;
        }
        .video-details span { color: #fff; font-weight: 600; }

        /* === Toggles & Sliders === */
        .feature-header { display: flex; justify-content: space-between; align-items: center; }
        .feature-title { font-weight: 600; font-size: 1.05rem; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.15); transition: .3s; border-radius: 34px;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px;
            background-color: white; transition: .3s; border-radius: 50%; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input:checked + .slider-toggle { background-color: var(--apple-blue); }
        input:checked + .slider-toggle:before { transform: translateX(22px); }

        .slider-container { margin-top: 20px; display: none; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 12px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 22px; width: 22px; border-radius: 50%; background: #fff;
            cursor: pointer; -webkit-appearance: none; margin-top: -8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 0 0 4px var(--apple-blue); transition: 0.2s;
        }
        .slider-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #8e8e93; font-weight: 600; text-transform: uppercase;}

        .custom-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px; border-radius: 12px; margin-top: 15px; box-sizing: border-box; display: none;
        }
        .custom-input:focus { outline: none; border-color: var(--apple-blue); }

        /* === Start Button === */
        .start-btn {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #0A84FF, #302b63);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; font-size: 1.15rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 8px 20px rgba(10, 132, 255, 0.25); transition: 0.3s;
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(10, 132, 255, 0.4); }
        .start-btn:disabled { background: #333; color: #777; cursor: not-allowed; border:none; box-shadow: none; transform: none; }

        /* === Progress === */
        .progress-box { display: none; text-align: center; margin-top: 20px; }
        progress { width: 100%; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; -webkit-appearance: none; }
        progress::-webkit-progress-bar { background-color: rgba(255,255,255,0.1); }
        progress::-webkit-progress-value { background-color: var(--apple-blue); box-shadow: 0 0 10px var(--apple-blue); }

        /* === Compact Rules & Tutorial === */
        .rules-card { font-size: 0.8rem; }
        .lang-toggle-box { display: flex; gap: 8px; }
        .lang-box {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; 
            font-size: 0.75rem; font-weight: 600; transition: 0.2s;
        }
        .lang-box.active { background: var(--apple-blue); border-color: var(--apple-blue); }
        .rules-list { padding-left: 20px; margin: 0; line-height: 1.4; color: #c7c7cc; }
        .rules-list li { margin-bottom: 6px; } 

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
    </style>
</head>

        <div class="title-container">
            <h1 class="main-title">YZ Tool V5</h1>

        </div>

        <div class="loader-container" id="engineStatus">

        <div class="glass-card">

                <input type="range" id="f2-slider" min="1" max="3" value="1" step="1">

                    <span>Normal</span><span>High</span><span>Extreme</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="feature-header">
                <span class="feature-title">Custom Config (Pro)</span>

                    <input type="checkbox" id="f3-toggle">

        <button class="start-btn" id="startBtn" onclick="startProcess()">Start Processing</button>
        
        <div class="progress-box" id="progressBox">

            <progress id="progressBar" value="0" max="100"></progress>
        </div>

        <div class="glass-card rules-card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 12px;">
                <b style="font-size: 0.9rem; display: flex; align-items: center; gap: 8px; color: #e0e0e0;">
                    Language
                </b>
                <div class="lang-toggle-box">
                    <div class="lang-box active" id="btn-mm" onclick="switchLang('MM')">မြန်မာ</div>
                    <div class="lang-box" id="btn-en" onclick="switchLang('EN')">English</div>
                </div>
            </div>
            <div id="ruleContent"></div>
        </div>

    </div>

    <script>
        /* === 1. Security Logic === */
        setInterval(function() { (function() { return false; }['constructor']('debugger')()); }, 2000);
        
        const allowedDomains = ['ya2umi12.github.io', 'localhost', '127.0.0.1'];
        const currentDomain = window.location.hostname;
        if (!allowedDomains.includes(currentDomain) && currentDomain !== "") {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%;'>Unauthorized Domain! YZ Tool is locked.</h1>";
            window.location.href = "https://t.me/yazumiskylin3"; 
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.key === 'S') || (e.ctrlKey && e.key === 'P') ||
                (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'J' || e.key === 'U'))) {
                e.preventDefault(); return false;
            }
        });

        /* === 2. Original Engine Logic === */
        let isEngineLoaded = false;
        let ffmpeg = null;
        let currentLang = 'MM';
        let selectedFile = null;

        const toast = document.getElementById('toast');
        const startBtn = document.getElementById('startBtn');
        const f1Toggle = document.getElementById('f1-toggle');
        const f2Toggle = document.getElementById('f2-toggle');
        const f3Toggle = document.getElementById('f3-toggle');
        const f1SliderBox = document.getElementById('f1-slider-box');
        const f2SliderBox = document.getElementById('f2-slider-box');
        const f3Input = document.getElementById('f3-input');
        const uploader = document.getElementById('videoUploader');
        
        window.onload = async () => {
            const { createFFmpeg } = FFmpeg;
            async function tryLoad(cdnUrl) {
                ffmpeg = createFFmpeg({ corePath: cdnUrl, log: false });
                ffmpeg.setProgress(({ ratio }) => {
                    let percent = Math.round(ratio * 100);
                    if(percent < 0) percent = 0; if(percent > 100) percent = 100;
                    document.getElementById('progressBar').value = percent;
                    document.getElementById('progressText').innerText = `Processing: ${percent}%`;
                });
                await ffmpeg.load();
            }

            try {
                await tryLoad('https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js');
                engineSuccess();
            } catch (err1) {
                console.log("jsDelivr failed, trying unpkg...", err1);
                try {
                    await tryLoad('https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js');
                    engineSuccess();
                } catch (err2) {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('statusText').innerText = "Engine Load Failed. Please refresh.";
                    document.getElementById('statusText').style.color = "red";
                }
            }
            switchLang('MM'); 
        };

        function engineSuccess() {
            isEngineLoaded = true;
            document.getElementById('spinner').style.display = 'none';
            const status = document.getElementById('statusText');
            status.innerText = "✓ YZ Engine Ready";
            status.className = "success-text";
            status.style.display = "block";
        }

        function checkEngine(e) {
            if (!isEngineLoaded) {
                e.preventDefault();
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 2000);
            }
        }

        uploader.addEventListener('change', (e) => {
            if(!isEngineLoaded) return;
            const file = e.target.files[0];
            if(!file) return;
            selectedFile = file;

            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = function() {
                window.URL.revokeObjectURL(video.src);
                document.getElementById('v-res').innerText = `${video.videoWidth}x${video.videoHeight}`;
                const mins = Math.floor(video.duration / 60);
                const secs = Math.floor(video.duration % 60);
                document.getElementById('v-dur').innerText = `${mins}m ${secs}s`;
                const bitrateKbps = Math.round((file.size * 8) / video.duration / 1024);
                document.getElementById('v-bit').innerText = `${bitrateKbps} kbps`;
                document.getElementById('videoDetails').style.display = 'grid';
            }
            video.src = URL.createObjectURL(file);
        });

        f1Toggle.addEventListener('change', (e) => {
            if(!isEngineLoaded) { e.target.checked = false; return; }
            f1SliderBox.style.display = e.target.checked ? 'block' : 'none';
            if(e.target.checked && f3Toggle.checked) { f3Toggle.checked = false; triggerF3(); }
        });
        f2Toggle.addEventListener('change', (e) => {
            if(!isEngineLoaded) { e.target.checked = false; return; }
            f2SliderBox.style.display = e.target.checked ? 'block' : 'none';
            if(e.target.checked && f3Toggle.checked) { f3Toggle.checked = false; triggerF3(); }
        });
        f3Toggle.addEventListener('change', (e) => {
            if(!isEngineLoaded) { e.target.checked = false; return; }
            triggerF3();
            if(e.target.checked) {
                f1Toggle.checked = false; f1SliderBox.style.display = 'none';
                f2Toggle.checked = false; f2SliderBox.style.display = 'none';
            }
        });
        function triggerF3() { f3Input.style.display = f3Toggle.checked ? 'block' : 'none'; }

        /* === Translations Data === */
        const texts = {
            EN: `
                <ul class="rules-list">
                    <li>Use YZ V5 on Chrome Browser.</li>
                    <li>Settings can be left at default.</li>
                    <li>Enabling <b>Ultra Smooth</b> alone retains video duration but gives high-quality smoothness.</li>
                    <li>Enabling <b>Fake FPS</b> changes video duration and causes a slow-mo bug on browsers. (Works fine on Mobile).</li>
                    <li>To upload to TikTok, download Edge Browser.</li>
                    <li>In Edge, turn on Desktop Mode and upload with privacy 'Only me'.</li>
                    <li>Include <b>#yztool</b> in the caption.</li>
                    <li>Change visibility back to 'Everyone' from the TikTok App later.</li>
                </ul>`,
            MM: `
                <ul class="rules-list">
                    <li>YZ V5 ကို Chrome Browser မှာ အသုံးပြုပါ။</li>
                    <li>Setting များကို Default အတိုင်း ထားသုံးနိုင်ပါတယ်။</li>
                    <li><b>Ultra Smooth</b> တစ်ခုတည်း On လျှင် Video duration ပြောင်းလဲမှုမရှိဘဲ smooth ဖြစ်ဖြစ် quality ရပါမယ်။</li>
                    <li><b>Fake FPS</b> On ပါက Video duration ပြောင်းလဲမှုရှိပြီး Browser တွင် Slow-mo bug ဖြစ်ပါမယ်။ But Mobile တွင် အဆင်ပြေပါလိမ့်မယ်။</li>
                    <li>Tiktok ပေါ် Video တင်ရန် Edge Browser ကို Download ဆွဲပါ။</li>
                    <li>Edge browser မှာ Desktop mode On ပြီး Privacy ကို 'Only me' ထားပြီး တင်ပါ။</li>
                    <li>Caption မှာ <b>#yztool</b> ထည့်ရေးပါ။</li>
                    <li>Tiktok App မှ 'Everyone' ပြန်ပြောင်းပါ။</li>
                </ul>`
        };

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('ruleContent').innerHTML = texts[lang];
            document.getElementById('btn-mm').className = lang === 'MM' ? 'lang-box active' : 'lang-box';
            document.getElementById('btn-en').className = lang === 'EN' ? 'lang-box active' : 'lang-box';
        }

        async function startProcess() {
            if(!isEngineLoaded) { showToast(); return; }
            if(!selectedFile) { alert("Please select a video file first!"); return; }
            
            const f1Map = {
                "1": "tmix=frames=2:weights=5 5",
                "2": "tmix=frames=3:weights=6 3 1",
                "3": "tmix=frames=4:weights=4 3 2 1"
            };
            
            // Updated Fake FPS mapping values as requested
            const f2Map = {
                "1": { scale: '2', fps: '30' },  // Normal
                "2": { scale: '2', fps: '60' },  // High
                "3": { scale: '3', fps: '30' }   // Extreme
            };

            let args = [];

            if (f3Toggle.checked) {
                const customText = f3Input.value.trim();
                if(!customText) { alert("Please enter custom arguments!"); return; }
                args = ['-i', 'input.mp4', ...customText.split(' '), '-movflags', '+faststart', 'output.mp4'];
            } else {
                if(f2Toggle.checked) {
                    args.push('-itsscale', f2Map[document.getElementById('f2-slider').value].scale);
                }
                args.push('-i', 'input.mp4');
                if(f1Toggle.checked) {
                    args.push('-filter:v', f1Map[document.getElementById('f1-slider').value]);
                }
                if(f2Toggle.checked) {
                    args.push('-r', f2Map[document.getElementById('f2-slider').value].fps);
                }
                
                args.push('-preset', 'ultrafast');
                
                // Faststart Dynamic Logic Rules
                if (f2Toggle.checked) {
                    // If Fake FPS is ON (or both are ON) -> auto remove faststart to prevent crash
                } else {
                    // If Fake FPS is OFF (meaning only Ultra Smooth is ON or both are OFF) -> keep faststart
                    args.push('-movflags', '+faststart');
                }
                
                args.push('output.mp4');
            }

            if(!f1Toggle.checked && !f2Toggle.checked && !f3Toggle.checked) {
                args = ['-i', 'input.mp4', '-c', 'copy', '-movflags', '+faststart', 'output.mp4'];
            }

            startBtn.disabled = true;
            startBtn.innerText = "Processing Engine Running...";
            document.getElementById('progressBox').style.display = 'block';
            document.getElementById('progressBar').value = 0;
            
            try {
                const { fetchFile } = FFmpeg;
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));
                
                await ffmpeg.run(...args);
                
                const data = ffmpeg.FS('readFile', 'output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `YZ_${selectedFile.name}`; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                startBtn.innerText = "Completed! Check Downloads";
                startBtn.style.background = "#34C759";
                
                try {
                    ffmpeg.FS('unlink', 'input.mp4');
                    ffmpeg.FS('unlink', 'output.mp4');
                } catch(e) {}

                setTimeout(() => {
                    startBtn.innerText = "Start Processing";
                    startBtn.style.background = "";
                    startBtn.disabled = false;
                    document.getElementById('progressBox').style.display = 'none';
                }, 4000);

            } catch (error) {
                console.error(error);
                alert("An error occurred during processing. Check console for details.");
                startBtn.innerText = "Start Processing";
                startBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
